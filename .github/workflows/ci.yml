name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-ci.lock
      - name: Run backend & weight integrity tests
        env:
          SKIP_MODEL_LOAD: "1"
        run: pytest -v
