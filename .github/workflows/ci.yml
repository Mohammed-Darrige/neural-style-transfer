name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115.0,<1.0.0" "pydantic>=2.7.0,<3.0.0" "pillow>=10.0.0,<12.0.0" "pytest>=8.0.0,<9.0.0" "httpx>=0.27.0,<1.0.0"
      - name: Run backend & weight integrity tests
        env:
          SKIP_MODEL_LOAD: "1"
        run: pytest -v
